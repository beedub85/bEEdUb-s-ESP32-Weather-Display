[platformio]
default_envs = waveshare_7_8mb

[env]
; Arduino 3 / ESP-IDF 5 is required by ESP32_Display_Panel 1.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
  -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7
  -I include
; Pinned Espressif display/expander/utils sources are bundled under lib/.
lib_deps =
  lvgl/lvgl@8.4.0
  bblanchon/ArduinoJson@7.4.2

[env:waveshare_7_8mb]
board_upload.flash_size = 8MB
board_build.flash_size = 8MB

[env:waveshare_7_16mb]
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
